{% load static %}
<!DOCTYPE html><html><head><title>Reset password | Flood Risk Prediction</title><link rel="stylesheet" href="{% static 'predictor/style.css' %}"></head>
<body><div class="container narrow"><div class="card"><h1>Reset your password</h1><p>Enter the email address on your account. We will send a password reset link.</p>

<p><a href="{% url 'login' %}">Back to sign in</a></p></div></div></body></html>
