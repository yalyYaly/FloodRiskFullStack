{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Flood Risk Prediction System</title>
    <link rel="stylesheet" href="{% static 'predictor/style.css' %}">
    {% load static %}
<link rel="stylesheet" href="{% static 'predictor/style.css' %}">
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>Flood Risk Prediction System</h1>
            <p>Enter local conditions to predict flood risk.</p>

            <form method="post">
                {% csrf_token %}

                <label>Rainfall (mm)</label>
                <input type="number" name="rainfall" required>

                <label>River Level (metres)</label>
                <input type="number" step="0.1" name="river_level" required>

                <label>Area Type</label>
                <select name="area_type">
                    <option value="Normal">Normal</option>
                    <option value="Low-lying">Low-lying</option>
                    <option value="Hilly">Hilly</option>
                </select>

                <button type="submit">Predict Flood Risk</button>
            </form>

            {% if risk %}
                <div class="result {{ risk|lower }}">
                    <h2>Flood Risk: {{ risk }}</h2>
                    <p>{{ advice }}</p>
                    <small>Prediction method: {{ prediction_method }}</small>
                </div>
            {% endif %}

            <p><a href="/history/">View Saved Flood Reports</a></p>
        </div>
    </div>
</body>
</html>
